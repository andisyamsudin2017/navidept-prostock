<script>
/* ==========================================================
   ✅ KONFIGURASI SUPABASE
   ⚠️ GANTI DENGAN URL DAN KEY ANDA!
   ========================================================== */
const SUPABASE_URL = 'https://csvkzqburletwqjpaxno.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmt6cWJ1cmxldHdxanBheG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDc4NjMsImV4cCI6MjEwODY4Mzg2M30.4vAEO7z0-eoir_LPX-mqdCZbGPKDbKiWxCnxPjjFbes';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ==========================================================
   ✅ DATA LAYER: Cache + Supabase Cloud
   ========================================================== */
const CACHE = {};
let realtimeChannel = null;

function ld(k) {
    return CACHE[k] || [];
}

async function sv(k, d) {
    CACHE[k] = d;
    const { error } = await db
        .from('app_data')
        .upsert({ key: k, data: d, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) {
        console.error('Sync error:', error);
        err('⚠️ Gagal sync ke cloud!');
    }
}

async function initDB() {
    showLoading(true);
    try {
        const { data, error } = await db.from('app_data').select('*');
        if (error) throw error;
        KEYS.forEach(k => { CACHE[k] = []; });
        (data || []).forEach(row => {
            if (KEYS.includes(row.key)) CACHE[row.key] = row.data || [];
        });
        console.log('✅ Data dimuat dari cloud');
    } catch (e) {
        console.error('❌ Gagal muat data:', e);
        alert('Gagal terhubung ke database!\n\nError: ' + e.message +
              '\n\nPastikan URL & Key Supabase sudah benar di dalam kode.');
    }
    showLoading(false);
}

function setupRealtime() {
    if (realtimeChannel) db.removeChannel(realtimeChannel);
    realtimeChannel = db.channel('navidept_sync')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'app_data' },
            (payload) => {
                const key = payload.new?.key || payload.old?.key;
                if (key && KEYS.includes(key)) {
                    CACHE[key] = payload.new?.data || [];
                    render();
                    flashSync();
                }
            }
        )
        .subscribe((status) => {
            updateSyncStatus(status === 'SUBSCRIBED');
        });
}

function showLoading(show) {
    document.getElementById('loadingScreen').style.display = show ? 'flex' : 'none';
}
function updateSyncStatus(online) {
    const el = document.getElementById('syncStatus');
    if (el) { el.className = online ? 'online' : 'offline'; el.textContent = online ? '☁️ Online' : '⚠️ Offline'; }
}
function flashSync() {
    const el = document.getElementById('syncStatus');
    if (el) { el.className = 'syncing'; el.textContent = '🔄 Sync...'; setTimeout(() => { el.className = 'online'; el.textContent = '☁️ Online'; }, 1500); }
}

async function migrateLocalToCloud() {
    let count = 0;
    for (const k of KEYS) {
        try {
            const local = JSON.parse(localStorage.getItem(k)) || [];
            if (local.length > 0) {
                const existing = CACHE[k] || [];
                if (existing.length === 0) {
                    CACHE[k] = local;
                    await sv(k, local);
                    count += local.length;
                }
            }
        } catch(e) {}
    }
    if (count > 0) ok('Migrasi berhasil! ' + count + ' data dikirim ke cloud.');
    else err('Tidak ada data lokal baru untuk dimigrasi.');
}

/* ====== CONSTANTS ====== */
const USERS={
  owner:{pw:'owner123',role:'owner',name:'Owner',title:'NaviDept ProStock Care',cls:'owner'},
  produksi:{pw:'produksi123',role:'produksi',name:'Manajer Produksi',title:'NaviDept ProStock Care',subtitle:'Simanja Nazwa Fashion',cls:'produksi'},
  packing:{pw:'packing123',role:'packing',name:'Manajer Packing',title:'NaviDept ProStock Care',cls:'packing'},
  paket:{pw:'paket123',role:'paket',name:'Manajer Packing Paket & Stocker',title:'NaviDept ProStock Care',cls:'paket'}
};
const KEYS=['m_kat','m_sat','m_sup','m_pen','m_ker','m_bar','m_hrg','d_beli','d_prod','d_pack','d_paket'];
const TABS={
  owner:{master:'📁 Master',bahan:'🧾 Input Bahan',monitor:'📊 Monitoring',stok:'📦 Stok',backup:'💾 Backup'},
  produksi:{master:'📁 Master',exim:'🔄 Export/Import',input:'✏️ Input',riwayat:'📋 Riwayat'},
  packing:{input:'✏️ Input',riwayat:'📋 Riwayat'},
  paket:{input:'📦 Input',stokawal:'📥 Stok Awal',riwayat:'📋 Riwayat'}
};
let CUR={role:'',tab:''};
let tempItems=[];

/* ====== HELPERS ====== */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function td(){return new Date().toISOString().slice(0,10)}
function fd(s){if(!s)return'-';const d=new Date(s);const m=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()}
function rp(n){return'Rp '+Number(n||0).toLocaleString('id-ID')}
function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}
function ok(m){const t=document.getElementById('toast');t.textContent=m;t.className='show ok';setTimeout(()=>t.className='',2500)}
function err(m){const t=document.getElementById('toast');t.textContent=m;t.className='show err';setTimeout(()=>t.className='',2500)}
function opts(arr,vk,lk,sel){return(arr||[]).map(x=>`<option value="${esc(x[vk])}"${sel===x[vk]?' selected':''}>${esc(x[lk])}</option>`).join('')}
function bnd(id,ev,fn){const e=document.getElementById(id);if(e)e.addEventListener(ev,fn)}

/* ====== RENDER & BIND ====== */
function render(){
  const role=CUR.role, tab=CUR.tab;
  const u=USERS[role];
  document.getElementById('app').className=u.cls;
  const uu=USERS[role];
  document.getElementById('hdrTitle').textContent=uu.title||'NaviDept ProStock Care';
  const hintMap={
    owner:'💡 Pantau produksi, stok & pengiriman',
    produksi:'💡 Kelola data penjahit, pekerjaan & input produksi',
    packing:'💡 Cek kualitas & jumlah barang jahit',
    paket:'💡 Pack, kirim pesanan & kelola stok awal'
  };
  document.getElementById('hdrUser').innerHTML=(uu.subtitle?uu.subtitle+'<br>':'')+uu.name+'<br><span style="font-size:.72rem;opacity:.75;font-style:italic">'+(hintMap[role]||'')+'</span>';
  const tabs=TABS[role];
  document.getElementById('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>
    `<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${v}</button>`
  ).join('');
  let html='';
  if(role==='owner') html=htmlOwner(tab);
  else if(role==='produksi') html=htmlProduksi(tab);
  else if(role==='packing') html=htmlPacking(tab);
  else if(role==='paket') html=htmlPaket(tab);
  document.getElementById('content').innerHTML=html;
  if(role==='owner'){
    if(tab==='master'){rKat();rSat();rSup();rBar()}
    if(tab==='bahan'){renderItemList();rBeli()}
    if(tab==='monitor') rMonitor();
    if(tab==='stok') rStok();
  }
  if(role==='produksi'){
    if(tab==='master'){rPen();rKer();rBar();rHrg()}
    if(tab==='input') bnd('pInv','change',showInvDetail);
    if(tab==='riwayat') rProd();
  }
  if(role==='packing'&&tab==='riwayat') rPack();
  if(role==='paket'&&tab==='riwayat') rPaket();
  if(role==='paket'&&tab==='stokawal') rStokAwal();
}

function switchTab(t){
  CUR.tab=t;
  sessionStorage.setItem('navi_tab',t);
  tempItems=[];
  render();
}

function addItem(){
  const kat=gv('bKat'),nama=gv('bNama'),sat=gv('bSat'),jml=+gv('bJml'),hrg=+gv('bHrg'),ket=gv('bKet');

function rmItem(i){tempItems.splice(i,1);renderItemList()}
function renderItemList(){
  const el=document.getElementById('itemList');
  const tel=document.getElementById('invoiceTotal');
  if(!el)return;
  if(!tempItems.length){el.innerHTML='<p class="empty">Belum ada item</p>';if(tel)tel.textContent='';return}
  let h=`<table class="item-tbl"><tr><th>No</th><th>Kategori</th><th>Nama</th><th>Satuan</th><th>Jml</th><th>Harga</th><th>Total</th><th></th></tr>`;
  let tot=0;
  tempItems.forEach((it,i)=>{
    tot+=it.total;
    h+=`<tr><td>${i+1}</td><td>${esc(it.katN)}</td><td>${esc(it.nama)}</td><td>${esc(it.satN)}</td><td>${it.jml}</td><td>${rp(it.hrg)}</td><td>${rp(it.total)}</td><td><span class="del" onclick="rmItem(${i})">✕</span></td></tr>`;
  });

  if(tel)tel.textContent='Total Invoice: '+rp(tot);

function exportMaster(){
  const data={m_pen:ld('m_pen'),m_ker:ld('m_ker'),m_bar:ld('m_bar'),m_hrg:ld('m_hrg')};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});

  a.download='NaviDept_Master_'+td()+'.json';a.click();ok('Master di-export!');

async function importMaster(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const raw=JSON.parse(e.target.result);
      const data=raw.data||raw;
      let log=[];
      const pen=data.dataPenjahit||data.penjahit||data.m_pen||data.pen||[];
      if(pen.length){
        const arr=pen.map(x=>({k:x.k||x.kode||x.id||'',n:x.n||x.nama||x.name||''})).filter(x=>x.k&&x.n);
        if(arr.length){await sv('m_pen',arr);log.push('✓ Penjahit: '+arr.length+' data')}
      }
      const bar=data.dataBarang||data.barang||data.m_bar||data.bar||[];
      if(bar.length){
        const arr=bar.map(x=>({k:x.k||x.kode||x.id||'',n:x.n||x.nama||x.jenis||x.name||''})).filter(x=>x.k&&x.n);
        if(arr.length){await sv('m_bar',arr);log.push('✓ Barang: '+arr.length+' data')}
      }
      const ker=data.dataPekerjaan||data.pekerjaan||data.m_ker||data.ker||[];
      if(ker.length){
        const arr=ker.map(x=>({k:x.k||x.kode||x.id||'',n:x.n||x.nama||x.name||''})).filter(x=>x.k&&x.n);
        if(arr.length){await sv('m_ker',arr);log.push('✓ Pekerjaan: '+arr.length+' data')}
      }
      const hrg=data.dataHarga||data.harga||data.m_hrg||data.hrg||[];
      if(hrg.length){
        const arr=hrg.map(x=>({pk:x.pk||x.kodeKer||x.ker||'',bk:x.bk||x.kodeBar||x.bar||'',v:+(x.v||x.harga||x.value||0)})).filter(x=>x.pk&&x.bk);
        if(arr.length){await sv('m_hrg',arr);log.push('✓ Harga: '+arr.length+' data')}
      }
      if(!log.length){
        alert('Tidak ada data yang dikenali!\n\nKey yang ditemukan:\n'+Object.keys(data).join(', ')+'\n\nKey dalam "data":\n'+(raw.data?Object.keys(raw.data).join(', '):'-'));
        return;
      }
      alert('Berhasil import:\n\n'+log.join('\n'));
      render();
    }catch(err){
      alert('File tidak valid!\n\nError: '+err.message);
    }
  };
  reader.readAsText(file);
}

function rBeli(){
  const el=document.getElementById('listBeli');if(!el)return;
  const a=ld('d_beli');
  if(!a.length){el.innerHTML='<p class="empty">Belum ada invoice</p>';return}
  el.innerHTML=a.sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>{
    let itemsHtml='';
    if(x.items&&x.items.length){
      itemsHtml=x.items.map(it=>`• ${esc(it.nama)} - ${it.jml} ${esc(it.satN)} = ${rp(it.total)}`).join('<br>');
    }else{
      itemsHtml=`• ${esc(x.nama||'-')} - ${x.jml||0} ${esc(x.satN||'')} = ${rp(x.total||0)}`;
    }
    return `<div class="inv-card">
      <div class="inv-head"><strong>${esc(x.inv)}</strong><span>${fd(x.tgl)} | ${esc(x.supN||'')}</span><span class="del" onclick="delBeli('${x.id}')">✕</span></div>
      <div class="inv-items">${itemsHtml}</div>
      <div style="text-align:right;font-weight:700;margin-top:4px">${rp(x.total)}</div>
    </div>`;
  }).join('');
}

function rProd(){
  const el=document.getElementById('listProd');if(!el)return;
  const a=ld('d_prod'),pen=ld('m_pen'),ker=ld('m_ker'),bar=ld('m_bar'),hrg=ld('m_hrg');
  if(!a.length){el.innerHTML='<p class="empty">Belum ada data</p>';return}
  let grandTotal=0;
  const rows=a.sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>{
    const pn=(pen.find(p=>p.k===x.pen)||{}).n||x.pen;
    const kn=(ker.find(k=>k.k===x.ker)||{}).n||x.ker;
    const bn=(bar.find(b=>b.k===x.bar)||{}).n||x.bar;
    const h=(hrg.find(z=>z.pk===x.ker&&z.bk===x.bar)||{}).v||0;
    const total=x.jml*h;
    grandTotal+=total;
    return `<tr><td>${fd(x.tgl)}</td><td>${esc(x.inv)}</td><td>${esc(pn)}</td><td>${esc(kn)}</td><td>${esc(bn)}</td><td>${x.jml}</td><td>${rp(h)}</td><td><strong>${rp(total)}</strong></td><td><span class="del" onclick="delProd('${x.id}')">✕</span></td></tr>`;
  }).join('');
  el.innerHTML=`<div class="tbl-wrap"><table><tr><th>Tanggal</th><th>Invoice</th><th>Penjahit</th><th>Pekerjaan</th><th>Barang</th><th>Jml</th><th>Harga</th><th>Total</th><th></th></tr>`+
    rows+
    `<tr style="background:#e8eaf6"><td colspan="7" style="text-align:right;font-weight:700">GRAND TOTAL:</td><td colspan="2" style="font-weight:700;color:#1a5f4a">${rp(grandTotal)}</td></tr>`+
    `</table></div>`;
}

function rMonitor(){
  const el=document.getElementById('monitorData');if(!el)return;
  const prod=ld('d_prod'),bar=ld('m_bar'),ker=ld('m_ker'),pack=ld('d_pack'),paket=ld('d_paket'),pen=ld('m_pen');
  // === MP: hanya kode PK ===
  const mp=prod.filter(p=>p.ker&&p.ker.toUpperCase().startsWith('PK'));
  let h=`<h4 style="color:#1a237e">📊 MP - Monitoring Produksi (Jahit)</h4>`;
    if(!mp.length){h+=`<p class="empty">Belum ada data</p>`}
  else{h+=`<div class="tbl-wrap"><table><tr><th>Tanggal</th><th>Invoice</th><th>Barang</th><th>Jml</th></tr>`+
    mp.sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>{
      const bn=(bar.find(b=>b.k===x.bar)||{}).n||x.bar;
      return `<tr><td>${fd(x.tgl)}</td><td>${esc(x.inv)}</td><td>${esc(bn)}</td><td>${x.jml}</td></tr>`;
    }).join('')+`</table></div>`}
  // === MK: ringkasan per barang ===
  h+=`<hr><h4 style="color:#1a237e">📦 MK - Monitoring Packing & Kualitas</h4>`;
  const mk=bar.map(b=>{
    const pJ=prod.filter(p=>p.bar===b.k&&p.ker&&p.ker.toUpperCase().startsWith('PK')).reduce((s,x)=>s+x.jml,0);
    const pOk=pack.filter(x=>x.bar===b.k).reduce((s,x)=>s+(x.ok||0),0);
    const rej=pack.filter(x=>x.bar===b.k).reduce((s,x)=>s+(x.bad||0),0);
    const lp=pack.filter(x=>x.bar===b.k).sort((a,b)=>b.tgl.localeCompare(a.tgl))[0];
    const kond=lp?lp.kond:'-';
    const kirim=paket.filter(x=>x.bar===b.k).reduce((s,x)=>s+x.jml,0);
    return{kode:b.k,nama:b.n,pJ,pOk,rej,kond,stok:pOk-kirim};
  }).filter(x=>x.pJ>0||x.pOk>0||x.rej>0);
  if(!mk.length){h+=`<p class="empty">Belum ada data</p>`}
  else{h+=`<div class="tbl-wrap"><table><tr><th>Kode</th><th>Barang</th><th>Produksi (Jahit)</th><th>Packing OK</th><th>Reject</th><th>Kondisi</th><th>Stok</th></tr>`+
    mk.map(x=>`<tr><td>${esc(x.kode)}</td><td>${esc(x.nama)}</td><td>${x.pJ}</td><td><span class="badge badge-ok">${x.pOk}</span></td><td><span class="badge badge-bad">${x.rej}</span></td><td>${esc(x.kond)}</td><td><strong>${x.stok}</strong></td></tr>`).join('')+`</table></div>`}
  // === MK Reject Detail ===
  const rj=pack.filter(x=>x.bad>0);
  h+=`<hr><h4 style="color:#c62828">⚠️ MK - Barang Reject</h4>`;
  if(!rj.length){h+=`<p class="empty">Tidak ada barang reject</p>`}
  else{h+=`<div class="tbl-wrap"><table><tr><th>Tanggal</th><th>Barang</th><th>Reject</th><th>Kondisi</th><th>Keterangan</th></tr>`+
    rj.sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>{
      const bn=(bar.find(b=>b.k===x.bar)||{}).n||x.bar;
      return `<tr><td>${fd(x.tgl)}</td><td>${esc(bn)}</td><td><span class="badge badge-bad">${x.bad}</span></td><td>${esc(x.kond)}</td><td>${esc(x.ket)}</td></tr>`;
    }).join('')+`</table></div>`}
  
  // === Monitoring Pengiriman Paket ===
   // paket & bar sudah dideklarasikan di atas
  h+=`<hr><h4 style="color:#6a1b9a">🚚 Monitoring Pengiriman Paket</h4>`;
  if(!paket.length){h+=`<p class="empty">Belum ada pengiriman</p>`}
  else{
    const totalPaket=paket.reduce((s,x)=>s+x.jml,0);
    const platCount={};
    paket.forEach(x=>{platCount[x.plat]=(platCount[x.plat]||0)+1});
    const platInfo=Object.entries(platCount).map(([k,v])=>`<span class="badge badge-info">${esc(k)}: ${v}</span>`).join(' ');
    h+=`<p style="font-size:.85rem;color:#666;margin-bottom:8px">Total kirim: <strong>${totalPaket} pcs</strong> | ${platInfo}</p>`;
    h+=`<div class="tbl-wrap"><table><tr><th>Tanggal</th><th>Platform</th><th>No. Order</th><th>Barang</th><th>Jml</th><th>Resi</th><th>Ket</th></tr>`+
      paket.sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>{
        const bn=(bar.find(b=>b.k===x.bar)||{}).n||x.bar;
        return `<tr><td>${fd(x.tgl)}</td><td><span class="badge badge-info">${esc(x.plat)}</span></td><td>${esc(x.ord)}</td><td>${esc(bn)}</td><td>${x.jml}</td><td>${esc(x.resi)}</td><td>${esc(x.ket)}</td></tr>`;
      }).join('')+`</table></div>`;
  }
  el.innerHTML=h;
}  
function toggleStokFilter(){
  const p=(document.getElementById('stokPeriode')||{}).value||'semua';
  const fT=document.getElementById('filterTanggal');
  const fB=document.getElementById('filterBulanan');
  if(fT) fT.style.display=(p==='harian'||p==='mingguan')?'flex':'none';
  if(fB) fB.style.display=(p==='bulanan')?'flex':'none';
  // Set default tanggal mingguan = 7 hari lalu
  if(p==='mingguan'){
    const d=new Date();d.setDate(d.getDate()-7);
    const dari=document.getElementById('stokDari');
    if(dari&&!dari.dataset.set){dari.value=d.toISOString().slice(0,10);dari.dataset.set='1'}
  }
}
function rStok(){
  const el=document.getElementById('stokData');if(!el)return;
  const per=(document.getElementById('stokPeriode')||{}).value||'semua';
  const bar=ld('m_bar'),pack=ld('d_pack'),paket=ld('d_paket');
  // Hanya barang kode B
  const barB=bar.filter(b=>b.k.toUpperCase().startsWith('B'));
  let packF=pack, paketF=paket, label='Semua Waktu';
  if(per==='harian'||per==='mingguan'){
    const dari=gv('stokDari'),sampai=gv('stokSampai');
    if(dari&&sampai){
      packF=pack.filter(x=>{const t=(x.tgl||'').slice(0,10);return t>=dari&&t<=sampai});
      paketF=paket.filter(x=>{const t=(x.tgl||'').slice(0,10);return t>=dari&&t<=sampai});
      label=fd(dari)+' s/d '+fd(sampai);
    }
  }else if(per==='bulanan'){
    const bl=gv('stokBulan'),th=gv('stokTahun');
    if(bl&&th){
      const prefix=th+'-'+bl;
      packF=pack.filter(x=>x.tgl&&x.tgl.startsWith(prefix));
      paketF=paket.filter(x=>x.tgl&&x.tgl.startsWith(prefix));
      const namaBulan=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      label=namaBulan[+bl]+' '+th;
    }
  }
  // Debug info
  let debug=`<p style="font-size:.78rem;color:#999;margin-bottom:4px">Total packing: ${pack.length} | Terfilter: ${packF.length} | Total paket: ${paket.length} | Terfilter: ${paketF.length}</p>`;
  const rows=barB.map(b=>{
    const pOk=packF.filter(x=>x.bar===b.k).reduce((s,x)=>s+(x.ok||0),0);
    const kirim=paketF.filter(x=>x.bar===b.k).reduce((s,x)=>s+x.jml,0);
    return{kode:b.k,nama:b.n,stok:pOk-kirim};
  }).filter(x=>x.stok!==0||per==='semua');
  if(!rows.length){el.innerHTML=debug+'<p class="empty">Tidak ada data stok untuk periode ini</p>';return}
  el.innerHTML=debug+`<p style="font-size:.85rem;color:#666;margin-bottom:8px">Periode: <strong>${label}</strong></p>
    <div class="tbl-wrap"><table><tr><th>Kode</th><th>Barang</th><th>Stok</th></tr>`+
    rows.map(x=>`<tr><td>${esc(x.kode)}</td><td>${esc(x.nama)}</td><td><strong>${x.stok}</strong></td></tr>`).join('')+
    `</table></div>`;
}

/* ====== CALC ====== */
function calcStok(){
  const bar=ld('m_bar'),prod=ld('d_prod'),pack=ld('d_pack'),paket=ld('d_paket'),ker=ld('m_ker');
  return bar.map(b=>{
    const pP=prod.filter(p=>{const k=ker.find(x=>x.k===p.ker);return p.bar===b.k&&k&&k.n.toLowerCase().includes('jahit')}).reduce((a,x)=>a+x.jml,0);
    const pK=pack.filter(x=>x.bar===b.k).reduce((a,x)=>a+x.ok,0);
    const pS=paket.filter(x=>x.bar===b.k).reduce((a,x)=>a+x.jml,0);
    return{kode:b.k,nama:b.n,prod:pP,packOk:pK,kirim:pS,stok:pK-pS};
  });
}

/* ====== BACKUP ====== */
function backupAll(){
  const data={};KEYS.forEach(k=>data[k]=ld(k));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='NaviDept_Backup_'+td()+'.json';a.click();ok('Backup berhasil!');
}
function restoreAll(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const data=JSON.parse(e.target.result);
      for(const k of KEYS){if(data[k])await sv(k,data[k])}
      ok('Data berhasil di-restore!');render();
    }catch(err){alert('File tidak valid!')}
  };
  reader.readAsText(file);
}

/* ====== BOOT ====== */
function boot(){
  const role=sessionStorage.getItem('navi_role');
  if(!role){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  CUR.role=role;
  CUR.tab=sessionStorage.getItem('navi_tab')||Object.keys(TABS[role])[0];
  render();
}

document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const u=gv('user').toLowerCase(),p=gv('pass');
  if(USERS[u]&&USERS[u].pw===p){
    sessionStorage.setItem('navi_role',USERS[u].role);
    sessionStorage.setItem('navi_tab','');
    boot();
  }else{
    alert('Username atau Password salah!');
  }
});

document.getElementById('btnLogout').addEventListener('click',function(){
  sessionStorage.clear();
  tempItems=[];
  boot();
});

// Init localStorage
KEYS.forEach(k=>{if(!localStorage.getItem(k))localStorage.setItem(k,'[]')});
boot();
